<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy Local Production Suite</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold: #FFD700; --gold-dark: #c9a800; --white: #ffffff; --grey: #8a8fa8;
  --red: #ff3b3b; --green: #00d26a; --shadow: 0 8px 32px rgba(0,0,0,0.5);
}

body.theme-classic {
  --bg-gradient: radial-gradient(ellipse at top, #0d14d4 0%, #03068a 60%, #020550 100%);
  --card-bg: #0a11cc; --card-border: rgba(255,215,0,0.3); --used-bg: #02048a; --panel-bg: rgba(0,0,0,0.4);
}
body.theme-dark {
  --bg-gradient: linear-gradient(135deg, #121214 0%, #1a1a1e 100%);
  --card-bg: #232329; --card-border: rgba(255,215,0,0.2); --used-bg: #161619; --panel-bg: rgba(0,0,0,0.6);
}
body.theme-retro {
  --bg-gradient: radial-gradient(circle, #2b004f 0%, #110022 100%);
  --card-bg: #ff007f; --card-border: #00ffff; --used-bg: #220033; --panel-bg: rgba(17, 0, 34, 0.8);
}
body.theme-music {
  --bg-gradient: linear-gradient(180deg, #2c3e50 0%, #000000 100%);
  --card-bg: #1c2833; --card-border: #e74c3c; --used-bg: #111; --panel-bg: rgba(28, 40, 51, 0.8);
}

body { font-family: 'Barlow', sans-serif; background: var(--bg-gradient); color: var(--white); min-height: 100vh; overflow-x: hidden; transition: background 0.3s; }
h1,h2,h3,h4 { font-family: 'Bebas Neue', sans-serif; letter-spacing: .05em; }

/* ── Layout shells ── */
.dashboard { min-height: 100vh; padding: 6rem 2rem 2rem 2rem; }
.game-screen { min-height: 100vh; background: var(--bg-gradient); }

/* ── Auth / Setup card ── */
.auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.auth-card { background: var(--panel-bg); border: 2px solid var(--gold); border-radius: 16px; padding: 2.5rem; width: 100%; box-shadow: var(--shadow); }
.auth-title { font-family: 'Bebas Neue', sans-serif; color: var(--gold); letter-spacing: .05em; }

/* ── Game board category headers ── */
.board-cat-header { background: rgba(0,0,0,0.4); border: 2px solid var(--gold); border-radius: 8px; padding: 0.75rem 0.5rem; text-align: center; }
.board-cat-text { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; text-transform: uppercase; color: var(--white); }

.topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--card-border); position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }

.editor-layout { display: flex; gap: 1.5rem; flex-direction: row; margin-top: 1rem; }
.editor-sidebar { width: 280px; flex-shrink: 0; background: var(--panel-bg); border: 1px solid var(--card-border); padding: 1.5rem; border-radius: 12px; height: fit-content; }
.editor-workspace { flex-grow: 1; overflow-x: auto; }
.editor-grid { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 0.75rem; }

.editor-cat-column { display: flex; flex-direction: column; gap: 0.75rem; }
.editor-cat-header { background: rgba(0,0,0,0.3); border: 2px solid var(--gold); color: #fff; font-family: 'Barlow Condensed'; font-weight: 700; text-transform: uppercase; padding: 0.6rem; border-radius: 8px; text-align: center; width: 100%; }
.editor-tile { background: var(--card-bg); border: 1px solid var(--card-border); padding: 1rem; border-radius: 8px; text-align: center; cursor: pointer; transition: transform 0.15s; }
.editor-tile:hover { transform: scale(1.03); border-color: var(--gold); }
.editor-tile-val { font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--gold); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(4px); }
.modal-content { background: var(--card-bg); border: 2px solid var(--gold); width: 100%; max-width: 600px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.modal-header { background: rgba(0,0,0,0.3); padding: 1rem 1.5rem; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; min-height: 320px; justify-content: center; }

.media-preview-box { background: rgba(0,0,0,0.4); border: 1px dashed var(--grey); min-height: 120px; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.media-preview-box img { max-width: 100%; max-height: 180px; object-fit: contain; }
.media-preview-box video { max-width: 100%; max-height: 180px; }
.text-overlay-display { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 0.4rem; border-radius: 4px; text-align: center; font-family: 'Barlow Condensed'; font-weight: 600; font-size: 1.1rem; color: #fff; }

.form-group { display: flex; flex-direction: column; gap: 0.4rem; text-align: left; }
.form-label { font-family: 'Barlow Condensed'; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--grey); }
.app-input { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 0.75rem 1rem; color: white; font-size: 1rem; outline: none; width: 100%; }
.app-input:focus { border-color: var(--gold); }

.game-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.75rem; width: 100%; }
.game-tile { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 8px; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
.game-tile:hover:not(.used) { border-color: var(--gold); transform: scale(1.02); }
.game-tile.used { background: var(--used-bg); opacity: 0.2; cursor: default; border-color: transparent; }
.game-tile-val { font-family: 'Bebas Neue'; font-size: 2.5rem; color: var(--gold); text-shadow: 0 3px 6px rgba(0,0,0,0.5); }

.host-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; padding: 1.5rem; margin-top: 4rem; }
.host-board-view { background: var(--panel-bg); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--card-border); }
.host-sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
.anti-cheat-box { background: #000; color: #fff; padding: 1.5rem; border-radius: 8px; font-family: 'Barlow Condensed'; font-size: 1.3rem; text-align: center; cursor: pointer; border: 1px dashed var(--gold); user-select: none; min-height: 80px; display: flex; align-items: center; justify-content: center; }
.anti-cheat-box.revealed { background: rgba(0,210,106,0.15); border-color: var(--green); color: #fff; font-family: 'Barlow'; font-size: 1.1rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.25rem; border-radius: 8px; border: none; font-family: 'Barlow Condensed'; font-size: 1.05rem; font-weight: 700; letter-spacing: .05em; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
.btn-gold { background: var(--gold); color: #000; }
.btn-gold:hover { background: #ffe54c; transform: translateY(-1px); }
.btn-blue { background: #1a22f5; color: white; }
.btn-blue:hover { background: #3d47ff; }
.btn-red { background: var(--red); color: white; }
.btn-green { background: var(--green); color: #000; }
.btn-text { background: transparent; color: var(--grey); padding: 0.5rem; }
.btn-text:hover { color: white; }
.btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 6px; }

.question-overlay { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
.q-category { font-family: 'Barlow Condensed'; font-size: 2rem; font-weight: 700; text-transform: uppercase; color: var(--gold); }
.score-chip { border: 2px solid var(--card-border); padding: 0.5rem 1rem; border-radius: 8px; text-align: center; background: rgba(0,0,0,0.3); min-width: 120px; }
.score-chip-val { font-family: 'Bebas Neue'; display: block; color: var(--green); }
.game-topbar { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 1rem; border-radius: 12px; }
.score-adj { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem; width: 100%; margin-bottom: 1rem; }
.score-adj-team { display: flex; flex-direction: column; align-items: center; padding: 0.5rem; border-radius: 6px; gap: 0.3rem; }

@media (max-width: 900px) {
  .editor-layout { flex-direction: column; }
  .editor-sidebar { width: 100%; }
  .editor-grid { grid-template-columns: repeat(2, 1fr); }
  .game-grid { grid-template-columns: repeat(3, 1fr); }
  .host-layout { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="theme-classic">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const gameChannel = new BroadcastChannel('jeopardy_game_channel');

const THEMES = [
  { id: 'theme-classic', name: 'Classic TV Blue' },
  { id: 'theme-dark',    name: 'Modern Dark Mode' },
  { id: 'theme-retro',   name: 'Retro Laser Neon' },
  { id: 'theme-music',   name: 'Vinyl Stage Theme' }
];

const generateBlankMatrix = (multiplier = 1) => Array.from({ length: 6 }, (_, c) => ({
  name: `Category ${c + 1}`,
  questions: Array.from({ length: 5 }, (_, q) => ({
    points: (q + 1) * 200 * multiplier,
    questionText: "", questionMedia: "", questionMediaType: "text",
    answerText:   "", answerMedia:   "", answerMediaType:   "text",
    isDailyDouble: false
  }))
}));

function App() {
  const [screen,         setScreen]         = useState("dashboard");
  const [activeBoard,    setActiveBoard]     = useState({ name: "My Ultimate Board", theme: "theme-classic", round1: generateBlankMatrix(1), round2: generateBlankMatrix(2) });
  const [currentRound,   setCurrentRound]   = useState("round1");
  const [editCell,       setEditCell]        = useState(null);
  const [teams,          setTeams]           = useState([{ name: "Team 1", score: 0 }, { name: "Team 2", score: 0 }]);
  const [usedTiles,      setUsedTiles]       = useState({});
  const [activeQuestion, setActiveQuestion]  = useState(null);
  const [showAnswer,     setShowAnswer]      = useState(false);
  const [hostPeek,       setHostPeek]        = useState(false);

  // Auto-switch to host view when opened with ?host=1
  useEffect(() => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('host') === '1') setScreen("host");
  }, []);

  // BroadcastChannel sync listener
  useEffect(() => {
    gameChannel.onmessage = (event) => {
      const { action, payload } = event.data;
      if (action === "SYNC_STATE") {
        setTeams(payload.teams);
        setUsedTiles(payload.usedTiles);
        setActiveQuestion(payload.activeQuestion);
        setShowAnswer(payload.showAnswer);
        setActiveBoard(payload.activeBoard);
        setCurrentRound(payload.currentRound);
        if (payload.activeBoard?.theme) document.body.className = payload.activeBoard.theme;
      }
    };
  }, []);

  const broadcastState = (
    updatedTeams = teams,
    updatedTiles = usedTiles,
    updatedQ     = activeQuestion,
    updatedAns   = showAnswer,
    rnd          = currentRound,
    brd          = activeBoard
  ) => {
    gameChannel.postMessage({
      action: "SYNC_STATE",
      payload: { teams: updatedTeams, usedTiles: updatedTiles, activeQuestion: updatedQ, showAnswer: updatedAns, currentRound: rnd, activeBoard: brd }
    });
  };

  const changeTheme = (themeId) => {
    document.body.className = themeId;
    const copy = { ...activeBoard, theme: themeId };
    setActiveBoard(copy);
    broadcastState(teams, usedTiles, activeQuestion, showAnswer, currentRound, copy);
  };

  // FIX: was double-backtick in original
  const triggerBoardDownload = () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activeBoard, null, 2));
    const a = document.createElement('a');
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `${activeBoard.name.toLowerCase().replace(/\s+/g, '_')}_board.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
  };

  const handleBoardUpload = (e) => {
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (!parsed.round1 || !parsed.round2) throw new Error("Invalid Board Template");
        setActiveBoard(parsed);
        document.body.className = parsed.theme || "theme-classic";
        setScreen("editor");
      } catch (err) { alert("Load Failed: " + err.message); }
    };
    if (e.target.files[0]) reader.readAsText(e.target.files[0]);
  };

  const processLocalFile = (e, targetFieldMedia, targetFieldType) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onloadend = () => {
      let type = "image";
      if (file.type.includes("video")) type = "video";
      if (file.type.includes("audio")) type = "audio";
      updateCellData(targetFieldMedia, reader.result);
      updateCellData(targetFieldType, type);
    };
    reader.readAsDataURL(file);
  };

  // FIX: was shallow-mutating state; now uses proper immutable spread
  const updateCellData = (field, value) => {
    const copy = { ...activeBoard };
    copy[currentRound] = copy[currentRound].map((cat, ci) =>
      ci !== editCell.catIdx ? cat : {
        ...cat,
        questions: cat.questions.map((q, qi) =>
          qi !== editCell.qIdx ? q : { ...q, [field]: value }
        )
      }
    );
    setActiveBoard(copy);
  };

  const launchGameMode = () => {
    document.body.className = activeBoard.theme || "theme-classic";
    setScreen("game");
    broadcastState(teams, {}, null, false, "round1", activeBoard);
  };

  const adjustTeamScore = (tIdx, amt) => {
    const copy = [...teams];
    copy[tIdx] = { ...copy[tIdx], score: copy[tIdx].score + amt };
    setTeams(copy);
    broadcastState(copy);
  };

  // ─── DASHBOARD ───────────────────────────────────────────────────────────────
  if (screen === "dashboard") {
    return (
      <div className="dashboard" style={{display:'flex', alignItems:'center', justifyContent:'center'}}>
        <div style={{textAlign:'center', background:'var(--panel-bg)', padding:'3rem', borderRadius:'16px', border:'2px solid var(--gold)', maxWidth:'500px', width:'100%'}}>
          <h1 style={{fontSize:'3.5rem', color:'var(--gold)', textShadow:'0 4px 10px rgba(0,0,0,0.5)'}}>Jeopardy Studio</h1>
          <p style={{color:'var(--grey)', textTransform:'uppercase', fontSize:'0.9rem', letterSpacing:'2px', marginBottom:'2rem'}}>No Cloud Limits • Pure Local Storage</p>
          <div style={{display:'flex', flexDirection:'column', gap:'1rem'}}>
            <button className="btn btn-gold" style={{width:'100%'}} onClick={() => setScreen("editor")}>
              <i className="fa-solid fa-square-plus"></i> Create New Blank Matrix
            </button>
            <label className="btn btn-blue" style={{width:'100%', position:'relative'}}>
              <i className="fa-solid fa-file-upload"></i> Upload Saved Board File
              <input type="file" accept=".json" onChange={handleBoardUpload} style={{display:'none'}} />
            </label>
          </div>
        </div>
      </div>
    );
  }

  // ─── EDITOR ──────────────────────────────────────────────────────────────────
  if (screen === "editor") {
    const activeMatrix = activeBoard[currentRound];
    return (
      <div className="dashboard">
        <div className="topbar">
          <input
            type="text"
            className="app-input"
            style={{maxWidth:'300px', fontFamily:'Bebas Neue', fontSize:'1.6rem', color:'var(--gold)', background:'transparent', border:'none', borderBottom:'2px solid var(--gold)', borderRadius:0, padding:0}}
            value={activeBoard.name}
            onChange={e => setActiveBoard({...activeBoard, name: e.target.value})}
          />
          <div style={{display:'flex', gap:'0.5rem'}}>
            {/* FIX: className needed backtick template literal; HTML entities removed */}
            <button className={`btn btn-sm ${currentRound === 'round1' ? 'btn-gold' : 'btn-text'}`} onClick={() => setCurrentRound("round1")}>Round 1</button>
            <button className={`btn btn-sm ${currentRound === 'round2' ? 'btn-gold' : 'btn-text'}`} onClick={() => setCurrentRound("round2")}>Round 2</button>
            <button className="btn btn-green btn-sm" onClick={triggerBoardDownload}><i className="fa-solid fa-download"></i> Download Board File</button>
            <button className="btn btn-text btn-sm" style={{color:'var(--red)'}} onClick={() => setScreen("dashboard")}><i className="fa-solid fa-rotate-left"></i> Main Menu</button>
          </div>
        </div>

        <div className="editor-layout">
          <div className="editor-sidebar">
            <h3 style={{color:'var(--gold)', marginBottom:'1rem', fontSize:'1.4rem'}}>Visual Engine</h3>
            <div className="form-group" style={{marginBottom:'1rem'}}>
              <label className="form-label">Color Scheme Blueprint</label>
              <select className="app-input" style={{background:'#000'}} value={activeBoard.theme || 'theme-classic'} onChange={e => changeTheme(e.target.value)}>
                {THEMES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
            </div>
            <button className="btn btn-gold" style={{width:'100%'}} onClick={() => setScreen("setup")}>
              <i className="fa-solid fa-play"></i> Play This Matrix
            </button>
          </div>

          <div className="editor-workspace">
            <div className="editor-grid">
              {activeMatrix.map((cat, catIdx) => (
                <div key={catIdx} className="editor-cat-column">
                  {/* FIX: was shallow-mutating state */}
                  <input
                    type="text"
                    className="editor-cat-header"
                    value={cat.name}
                    onChange={e => {
                      const copy = { ...activeBoard };
                      copy[currentRound] = copy[currentRound].map((c, ci) =>
                        ci !== catIdx ? c : { ...c, name: e.target.value }
                      );
                      setActiveBoard(copy);
                    }}
                  />
                  {cat.questions.map((q, qIdx) => (
                    <div key={qIdx} className="editor-tile" onClick={() => setEditCell({ type: 'question', catIdx, qIdx })}>
                      {/* FIX: was $`{q.points} — literal backtick in output */}
                      <div className="editor-tile-val">{`$${q.points}`}</div>
                      <div style={{fontSize:'0.75rem', color: (q.questionText || q.questionMedia) ? 'var(--green)' : 'var(--grey)'}}>
                        {(q.questionText || q.questionMedia) ? "⚡ Formed" : "Empty"}
                      </div>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* TWO-SCREEN MULTIMEDIA SLIDE DIALOG OVERLAY */}
        {editCell && (() => {
          const workingCell = activeBoard[currentRound][editCell.catIdx].questions[editCell.qIdx];
          const isQ     = editCell.type === 'question';
          const textKey  = isQ ? 'questionText'      : 'answerText';
          const mediaKey = isQ ? 'questionMedia'     : 'answerMedia';
          const typeKey  = isQ ? 'questionMediaType' : 'answerMediaType';

          return (
            <div className="modal-overlay">
              <div className="modal-content">
                <div className="modal-header">
                  {/* FIX: was `${...} — literal backtick before expression */}
                  <h3 style={{fontSize:'1.5rem'}}>{`$${workingCell.points} Matrix Setup`}</h3>
                  <div style={{fontFamily:'Barlow Condensed', fontWeight:'700', color:'var(--gold)', textTransform:'uppercase'}}>
                    {isQ ? "Phase 1: Question Prompt" : "Phase 2: Correct Answer Key"}
                  </div>
                </div>

                <div className="modal-body">
                  <div className="form-group">
                    <label className="form-label">Text Content Overlay Display</label>
                    <textarea className="app-input" rows="2" style={{resize:'none'}} value={workingCell[textKey]} onChange={e => updateCellData(textKey, e.target.value)} placeholder="Type subtitle overlay data here..." />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Media Source (Direct File Upload or Link)</label>
                    <div style={{display:'flex', gap:'0.5rem', marginBottom:'0.5rem'}}>
                      <label className="btn btn-blue btn-sm" style={{flexShrink:0}}>
                        <i className="fa-solid fa-upload"></i> Upload File
                        {/* FIX: accept was "image/,video/" — missing wildcard * */}
                        <input type="file" accept="image/*,video/*,audio/*" style={{display:'none'}} onChange={e => processLocalFile(e, mediaKey, typeKey)} />
                      </label>
                      <input
                        type="text"
                        className="app-input"
                        style={{flexGrow:1, padding:'0.3rem 0.5rem', fontSize:'0.9rem'}}
                        value={workingCell[mediaKey]?.startsWith("data:") ? "[Local Asset File Embedded]" : workingCell[mediaKey]}
                        onChange={e => { updateCellData(mediaKey, e.target.value); updateCellData(typeKey, "image"); }}
                        placeholder="Or paste absolute direct web URL address link..."
                      />
                    </div>
                  </div>

                  <div className="media-preview-box">
                    {workingCell[mediaKey] ? (
                      <>
                        {workingCell[typeKey] === 'image' && <img src={workingCell[mediaKey]} alt="preview" />}
                        {workingCell[typeKey] === 'video' && <video src={workingCell[mediaKey]} controls />}
                        {workingCell[typeKey] === 'audio' && <audio src={workingCell[mediaKey]} controls />}
                        {workingCell[textKey] && <div className="text-overlay-display">{workingCell[textKey]}</div>}
                      </>
                    ) : <span style={{color:'var(--grey)', fontSize:'0.9rem'}}>No External Media Assets Rendered</span>}
                  </div>
                </div>

                <div className="modal-header" style={{borderTop:'1px solid var(--card-border)', borderBottom:'none', background:'rgba(0,0,0,0.2)'}}>
                  <button className="btn btn-text" onClick={() => setEditCell(null)}>Exit Matrix Cell</button>
                  {isQ ? (
                    <button className="btn btn-gold btn-sm" onClick={() => setEditCell({...editCell, type:'answer'})}>Go to Answer Screen <i className="fa-solid fa-arrow-right"></i></button>
                  ) : (
                    <button className="btn btn-blue btn-sm" onClick={() => setEditCell({...editCell, type:'question'})}><i className="fa-solid fa-arrow-left"></i> Back to Question Screen</button>
                  )}
                </div>
              </div>
            </div>
          );
        })()}
      </div>
    );
  }

  // ─── TEAM SETUP ───────────────────────────────────────────────────────────────
  if (screen === "setup") {
    return (
      // FIX: auth-container / auth-card / auth-title were missing CSS definitions (now added above)
      <div className="auth-container">
        <div className="auth-card" style={{maxWidth:'500px'}}>
          <h2 className="auth-title" style={{fontSize:'2.5rem'}}>Combatant Squads</h2>
          <div style={{display:'flex', flexDirection:'column', gap:'0.8rem', margin:'1.5rem 0'}}>
            {teams.map((t, idx) => (
              <div key={idx} style={{display:'flex', gap:'0.5rem'}}>
                <input
                  type="text"
                  className="app-input"
                  style={{flexGrow:1}}
                  value={t.name}
                  onChange={e => { const copy = [...teams]; copy[idx] = {...copy[idx], name: e.target.value}; setTeams(copy); }}
                />
                {teams.length > 1 && (
                  <button className="btn btn-red btn-sm" onClick={() => setTeams(teams.filter((_, i) => i !== idx))}>
                    <i className="fa-solid fa-trash"></i>
                  </button>
                )}
              </div>
            ))}
            {/* FIX: was missing opening backtick on template literal */}
            <button className="btn btn-blue btn-sm" onClick={() => setTeams([...teams, { name: `Team ${teams.length + 1}`, score: 0 }])}>
              + Expand Roster Team
            </button>
          </div>
          <div style={{display:'flex', gap:'1rem'}}>
            <button className="btn btn-text" style={{flex:1}} onClick={() => setScreen("editor")}>Back</button>
            <button className="btn btn-gold" style={{flex:2}} onClick={launchGameMode}>Engage Screen</button>
          </div>
        </div>
      </div>
    );
  }

  // ─── LIVE GAME BOARD ─────────────────────────────────────────────────────────
  if (screen === "game") {
    const matrix = activeBoard[currentRound] || [];
    return (
      // FIX: game-screen was missing CSS definition (now added above)
      <div className="game-screen" style={{padding:'1.5rem'}}>
        <div className="game-topbar" style={{borderRadius:'12px', marginBottom:'1.5rem'}}>
          {/* FIX: auth-title CSS now defined */}
          <div className="auth-title" style={{fontSize:'2.2rem'}}>{activeBoard.name}</div>
          <div style={{display:'flex', gap:'1.5rem'}}>
            {teams.map((t, i) => (
              <div key={i} className="score-chip" style={{borderColor:'var(--gold)'}}>
                <span style={{fontSize:'1rem', color:'#fff'}}>{t.name}</span>
                {/* FIX: was `${t.score.toLocaleString()} — literal backtick */}
                <span className="score-chip-val" style={{fontSize:'2rem'}}>{`$${t.score.toLocaleString()}`}</span>
              </div>
            ))}
          </div>
          <button className="btn btn-blue btn-sm" onClick={() => window.open(window.location.href + "?host=1", '_blank')}>
            <i className="fa-solid fa-headset"></i> Open Host Controller Tab
          </button>
        </div>

        <div style={{padding:0, marginTop:'1rem'}}>
          <div className="game-grid">
            {matrix.map((cat, cIdx) => (
              <div key={cIdx} style={{display:'flex', flexDirection:'column', gap:'0.75rem'}}>
                {/* FIX: board-cat-header / board-cat-text CSS now defined */}
                <div className="board-cat-header">
                  <span className="board-cat-text" style={{fontSize:'1.3rem'}}>{cat.name}</span>
                </div>
                {cat.questions.map((q, qIdx) => {
                  const tileKey = `${currentRound}-${cIdx}-${qIdx}`;
                  const isUsed  = usedTiles[tileKey];
                  return (
                    // FIX: className was missing backtick template; HTML entities removed; tileKey was bare expression
                    <div
                      key={qIdx}
                      className={`game-tile ${isUsed ? 'used' : ''}`}
                      onClick={() => {
                        if (isUsed) return;
                        const payload = { ...q, tileKey, catName: cat.name };
                        setActiveQuestion(payload);
                        setShowAnswer(false);
                        broadcastState(teams, usedTiles, payload, false);
                      }}
                    >
                      {/* FIX: was $`{q.points} — literal backtick */}
                      {!isUsed && <span className="game-tile-val">{`$${q.points}`}</span>}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>

        {activeQuestion && (
          <div className="question-overlay" style={{background:'var(--bg-gradient)'}}>
            <div className="q-category">{activeQuestion.catName}</div>
            {/* FIX: was $`{activeQuestion.points} — literal backtick */}
            <div className="q-points" style={{fontSize:'4rem'}}>{`$${activeQuestion.points}`}</div>

            <div className="media-preview-box" style={{width:'100%', maxWidth:'800px', minHeight:'300px', marginBottom:'2rem', border:'none', background:'rgba(0,0,0,0.5)', borderRadius:'16px'}}>
              {showAnswer ? (
                <>
                  {activeQuestion.answerMedia ? (
                    <>
                      {activeQuestion.answerMediaType === 'image' && <img src={activeQuestion.answerMedia} alt="answer" />}
                      {activeQuestion.answerMediaType === 'video' && <video src={activeQuestion.answerMedia} autoPlay controls />}
                      {activeQuestion.answerMediaType === 'audio' && <audio src={activeQuestion.answerMedia} autoPlay controls />}
                      {activeQuestion.answerText && <div className="text-overlay-display" style={{fontSize:'1.8rem', padding:'1rem'}}>{activeQuestion.answerText}</div>}
                    </>
                  ) : (
                    <div style={{fontFamily:'Barlow Condensed', fontSize:'3.5rem', fontWeight:'700'}}>{activeQuestion.answerText || "No Answer Value Provided"}</div>
                  )}
                </>
              ) : (
                <>
                  {activeQuestion.questionMedia ? (
                    <>
                      {activeQuestion.questionMediaType === 'image' && <img src={activeQuestion.questionMedia} alt="question" />}
                      {activeQuestion.questionMediaType === 'video' && <video src={activeQuestion.questionMedia} autoPlay controls />}
                      {activeQuestion.questionMediaType === 'audio' && <audio src={activeQuestion.questionMedia} autoPlay controls />}
                      {activeQuestion.questionText && <div className="text-overlay-display" style={{fontSize:'1.8rem', padding:'1rem'}}>{activeQuestion.questionText}</div>}
                    </>
                  ) : (
                    <div style={{fontFamily:'Barlow Condensed', fontSize:'3.5rem', fontWeight:'700', padding:'2rem', textAlign:'center'}}>{activeQuestion.questionText || "Empty Cell Frame Context"}</div>
                  )}
                </>
              )}
            </div>

            <div className="score-adj" style={{maxWidth:'600px'}}>
              {teams.map((t, idx) => (
                <div key={idx} className="score-adj-team" style={{background:'rgba(255,255,255,0.06)', border:'1px solid var(--card-border)'}}>
                  {/* FIX: was `${t.score} — literal backtick */}
                  <span style={{fontFamily:'Barlow Condensed', fontSize:'1.4rem', fontWeight:'600'}}>{t.name}: {`$${t.score}`}</span>
                  <div style={{display:'flex', gap:'0.5rem'}}>
                    <button className="btn btn-green btn-sm" onClick={() => adjustTeamScore(idx,  activeQuestion.points)}>+{activeQuestion.points}</button>
                    <button className="btn btn-red   btn-sm" onClick={() => adjustTeamScore(idx, -activeQuestion.points)}>-{activeQuestion.points}</button>
                  </div>
                </div>
              ))}
            </div>

            <div style={{display:'flex', gap:'1rem', marginTop:'1.5rem'}}>
              <button className="btn btn-gold" onClick={() => { setShowAnswer(!showAnswer); broadcastState(teams, usedTiles, activeQuestion, !showAnswer); }}>
                {showAnswer ? "Show Question View" : "Reveal Valid Answer Key"}
              </button>
              <button className="btn btn-blue" onClick={() => {
                const nextTiles = { ...usedTiles, [activeQuestion.tileKey]: true };
                setUsedTiles(nextTiles);
                setActiveQuestion(null);
                setShowAnswer(false);
                broadcastState(teams, nextTiles, null, false);
              }}>Terminate Card Loop</button>
            </div>
          </div>
        )}

        <div style={{marginTop:'2rem', display:'flex', gap:'1rem', justifyContent:'center'}}>
          {/* FIX: className needed backtick template literal; HTML entities removed */}
          <button className={`btn btn-sm ${currentRound === 'round1' ? 'btn-gold' : 'btn-text'}`} onClick={() => { setCurrentRound("round1"); broadcastState(teams, usedTiles, activeQuestion, showAnswer, "round1"); }}>Round 1 Board</button>
          <button className={`btn btn-sm ${currentRound === 'round2' ? 'btn-gold' : 'btn-text'}`} onClick={() => { setCurrentRound("round2"); broadcastState(teams, usedTiles, activeQuestion, showAnswer, "round2"); }}>Round 2 Matrix</button>
          <button className="btn btn-text btn-sm" style={{color:'var(--red)'}} onClick={() => setScreen("editor")}><i className="fa-solid fa-arrow-left"></i> Exit Game View</button>
        </div>
      </div>
    );
  }

  // ─── HOST CONTROL PANEL ──────────────────────────────────────────────────────
  if (screen === "host") {
    const matrix = activeBoard[currentRound] || [];
    return (
      <div className="game-screen" style={{padding:'1rem'}}>
        <div className="topbar" style={{background:'#000'}}>
          <div className="auth-title" style={{fontSize:'1.8rem', color:'var(--gold)'}}>
            <i className="fa-solid fa-headset"></i> Discrete Command Console Bridge Panel
          </div>
          <div style={{fontFamily:'Barlow Condensed', fontWeight:'700', textTransform:'uppercase', color:'var(--green)'}}>
            <i className="fa-solid fa-tower-broadcast"></i> Sync Relay Core Bound
          </div>
        </div>

        <div className="host-layout">
          <div className="host-board-view">
            <h3 style={{marginBottom:'1rem', color:'var(--gold)', fontSize:'1.4rem'}}>
              Scoreboard Cross Reference Layout Overview ({currentRound === 'round1' ? "Round 1" : "Round 2"})
            </h3>
            <div style={{display:'grid', gridTemplateColumns:'repeat(6, 1fr)', gap:'0.5rem'}}>
              {matrix.map((cat, cIdx) => (
                <div key={cIdx} style={{display:'flex', flexDirection:'column', gap:'0.5rem'}}>
                  <div style={{background:'rgba(255,255,255,0.05)', padding:'0.3rem', borderRadius:'4px', fontSize:'0.75rem', fontWeight:'700', textTransform:'uppercase', textAlign:'center', textOverflow:'ellipsis', overflow:'hidden', whiteSpace:'nowrap'}}>
                    {cat.name}
                  </div>
                  {cat.questions.map((q, qIdx) => {
                    const tileKey = `${currentRound}-${cIdx}-${qIdx}`;
                    const isUsed  = usedTiles[tileKey];
                    return (
                      // FIX: was double-backtick on tileKey; HTML entities removed
                      <div
                        key={qIdx}
                        style={{background: isUsed ? '#111' : 'var(--card-bg)', border:'1px solid var(--card-border)', padding:'0.6rem 0.2rem', borderRadius:'6px', textAlign:'center', opacity: isUsed ? 0.3 : 1, cursor:'pointer'}}
                        onClick={() => {
                          if (isUsed) return;
                          const p = { ...q, tileKey, catName: cat.name };
                          setActiveQuestion(p);
                          setShowAnswer(false);
                          setHostPeek(false);
                          broadcastState(teams, usedTiles, p, false);
                        }}
                      >
                        {/* FIX: was $`{q.points} — literal backtick */}
                        <span style={{fontFamily:'Bebas Neue', fontSize:'1.1rem', color:'var(--gold)'}}>{`$${q.points}`}</span>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>

          <div className="host-sidebar">
            <div className="host-board-view">
              <h3 style={{color:'var(--gold)', marginBottom:'1rem'}}>Live Status Core Node</h3>
              {activeQuestion ? (
                <div style={{display:'flex', flexDirection:'column', gap:'1rem'}}>
                  <div>
                    <span style={{fontSize:'0.8rem', color:'var(--grey)', textTransform:'uppercase'}}>Active Cell Origin Scope</span>
                    {/* FIX: was `${activeQuestion.points} — literal backtick */}
                    <div style={{fontFamily:'Barlow Condensed', fontWeight:'700', fontSize:'1.2rem'}}>
                      {activeQuestion.catName} — {`$${activeQuestion.points}`}
                    </div>
                  </div>

                  <div>
                    <span style={{fontSize:'0.8rem', color:'var(--grey)', textTransform:'uppercase'}}>Question String Frame</span>
                    <p style={{background:'rgba(0,0,0,0.3)', padding:'0.5rem', borderRadius:'6px', fontSize:'0.95rem'}}>
                      {activeQuestion.questionText || "[Media Asset Payload Loaded]"}
                    </p>
                  </div>

                  <div>
                    <span style={{fontSize:'0.8rem', color:'var(--grey)', textTransform:'uppercase'}}>Anti-Cheat Masking Security Box</span>
                    {hostPeek ? (
                      <div className="anti-cheat-box revealed" onClick={() => setHostPeek(false)}>
                        {activeQuestion.answerText || "[Multimedia Response Source Active]"}
                      </div>
                    ) : (
                      <div className="anti-cheat-box" onClick={() => setHostPeek(true)}>
                        <i className="fa-solid fa-eye-slash"></i> TAP BOX TO REVEAL KEY DATA STRINGS
                      </div>
                    )}
                  </div>

                  <div style={{display:'flex', flexDirection:'column', gap:'0.5rem', marginTop:'0.5rem'}}>
                    <button className="btn btn-gold btn-sm" onClick={() => { setShowAnswer(!showAnswer); broadcastState(teams, usedTiles, activeQuestion, !showAnswer); }}>
                      Toggle View On Main Projector Tab
                    </button>
                    <button className="btn btn-red btn-sm" onClick={() => {
                      const n = { ...usedTiles, [activeQuestion.tileKey]: true };
                      setUsedTiles(n);
                      setActiveQuestion(null);
                      setShowAnswer(false);
                      setHostPeek(false);
                      broadcastState(teams, n, null, false);
                    }}>Kill Question Active View Loop</button>
                  </div>
                </div>
              ) : (
                <div style={{color:'var(--grey)', textAlign:'center', padding:'2rem 0'}}>No active playing tile matrix node engaged.</div>
              )}
            </div>

            <div className="host-board-view">
              <h3 style={{color:'var(--gold)', marginBottom:'1rem'}}>Realtime Ledgers</h3>
              <div style={{display:'flex', flexDirection:'column', gap:'0.6rem'}}>
                {teams.map((t, idx) => (
                  // FIX: removed invalid justifyBox property; kept justifyContent
                  <div key={idx} style={{display:'flex', alignItems:'center', justifyContent:'space-between', background:'rgba(255,255,255,0.05)', padding:'0.5rem 0.8rem', borderRadius:'8px'}}>
                    <span style={{fontFamily:'Barlow Condensed', fontWeight:'600'}}>
                      {t.name}: <strong style={{color:'var(--gold)'}}>${t.score}</strong>
                    </span>
                    <div style={{display:'flex', gap:'0.3rem'}}>
                      <button className="btn btn-green btn-sm" style={{padding:'0.2rem 0.5rem'}} onClick={() => {
                        if (activeQuestion) adjustTeamScore(idx, activeQuestion.points);
                        else { const c = [...teams]; c[idx] = {...c[idx], score: c[idx].score + 200}; setTeams(c); broadcastState(c); }
                      }}>+</button>
                      <button className="btn btn-red btn-sm" style={{padding:'0.2rem 0.5rem'}} onClick={() => {
                        if (activeQuestion) adjustTeamScore(idx, -activeQuestion.points);
                        else { const c = [...teams]; c[idx] = {...c[idx], score: c[idx].score - 200}; setTeams(c); broadcastState(c); }
                      }}>-</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
